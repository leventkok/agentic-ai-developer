services:
  api:
    build: .
    ports:
      - "8080:8080"
      - "9090:9090"
    environment:
      ENV: staging
      JWT_SECRET: staging-secret-minimum-32-characters
      DB_PATH: /tmp/bookmarks.db
      REDIS_URL: redis://redis:6379/0
      NATS_URL: nats://nats:4222
      PPROF_PORT: "6060"
    depends_on:
      - redis
      - nats
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://localhost:8080/ready"]
      interval: 10s
      timeout: 3s
      retries: 3

  worker:
    build: .
    entrypoint: ["/app/worker"]
    environment:
      ENV: staging
      DB_PATH: /tmp/bookmarks.db
      NATS_URL: nats://nats:4222
    depends_on:
      - nats

  redis:
    image: redis:7-alpine

  nats:
    image: nats:2-alpine

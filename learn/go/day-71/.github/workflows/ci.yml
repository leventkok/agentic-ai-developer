name: day-71-quality

on:
  push:
    paths:
      - "learn/go/day-71/**"
  pull_request:
    paths:
      - "learn/go/day-71/**"

defaults:
  run:
    working-directory: learn/go/day-71

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"

      - name: Install golangci-lint
        run: go install github.com/golangci/golangci-lint/cmd/golangci-lint@v1.62.2

      - name: Unit tests
        run: go test ./...

      - name: Coverage gate (service + sqlite)
        run: |
          go test ./internal/service/... -coverprofile=service.out
          svc=$(go tool cover -func=service.out | awk '/total:/ {print substr($3, 1, length($3)-1)}')
          echo "service coverage=${svc}%"
          awk -v p="$svc" 'BEGIN { exit !(p+0 >= 55) }'
          go test ./internal/repository/sqlite/... -coverprofile=sqlite.out
          sql=$(go tool cover -func=sqlite.out | awk '/total:/ {print substr($3, 1, length($3)-1)}')
          echo "sqlite coverage=${sql}%"
          awk -v p="$sql" 'BEGIN { exit !(p+0 >= 55) }'

      - name: Lint
        run: golangci-lint run ./...

      - name: Integration tests
        run: go test -tags=integration ./internal/httpapi/... ./internal/test/env/...

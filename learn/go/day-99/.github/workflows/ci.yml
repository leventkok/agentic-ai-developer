name: day-100-capstone-ci

on:
  push:
    paths:
      - "learn/go/day-100/**"
  pull_request:
    paths:
      - "learn/go/day-100/**"

defaults:
  run:
    working-directory: learn/go/day-100

jobs:
  test:
    strategy:
      matrix:
        go-version: ["1.22", "1.23"]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go-version }}
          cache-dependency-path: learn/go/day-100/go.sum

      - run: go test ./...
      - run: go vet ./...
      - run: go build -o bookmarks-api ./cmd/api
      - run: go build -o bookmarks-worker ./cmd/worker

      - name: Upload API binary
        if: matrix.go-version == '1.23' && github.ref == 'refs/heads/master'
        uses: actions/upload-artifact@v4
        with:
          name: bookmarks-api-linux
          path: learn/go/day-100/bookmarks-api

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: golangci/golangci-lint-action@v6
        with:
          version: v1.62.2
          working-directory: learn/go/day-100

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t bookmarks-api:ci .

  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: learn/go/day-100/go.mod
      - run: go test -tags=integration ./internal/httpapi/...

  capstone-gate:
    needs: [test, lint, docker, integration]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: learn/go/day-100/go.mod
      - run: go test ./internal/httpapi/... -run Health

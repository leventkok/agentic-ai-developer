run:
  timeout: 5m
  tests: true

linters:
  enable:
    - govet
    - staticcheck
    - errcheck
    - ineffassign

issues:
  exclude-dirs:
    - internal/gen
  exclude-rules:
    - path: _test\.go
      linters:
        - errcheck
    - path: internal/httpapi/response\.go
      linters:
        - errcheck
      text: "Encode"

output:
  formats:
    - format: colored-line-number
